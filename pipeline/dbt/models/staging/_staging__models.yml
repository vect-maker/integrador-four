version: 2

models:
  - name: stg_zonas
    description: "Capa de staging para cuadrantes urbanos y estratos socioeconómicos de Managua"
    columns:
      - name: id_zona
        description: "Identificador único de la zona"
        tests:
          - unique
          - not_null
      - name: estrato_socioeconomico
        description: "Estrato socioeconómico territorial"
        tests:
          - accepted_values:
              values: ['alto', 'medio', 'popular', 'comercial']

  - name: stg_cuadrantes
    description: "Capa de staging para los 92 cuadrantes sub-zona de Managua"
    columns:
      - name: id_cuadrante
        description: "Identificador único del cuadrante"
        tests:
          - unique
          - not_null

  - name: stg_usuarios
    description: "Capa de staging para usuarios pasajeros y sus preferencias de pago"
    columns:
      - name: id_usuario
        description: "Identificador único del usuario"
        tests:
          - unique
          - not_null

  - name: stg_conductores
    description: "Capa de staging para la flota de socios conductores y estado operativo"
    columns:
      - name: id_conductor
        description: "Identificador único del conductor"
        tests:
          - unique
          - not_null

  - name: stg_campanias
    description: "Capa de staging para campañas de bonos e incentivos económicos"
    columns:
      - name: id_campania
        description: "Identificador único de la campaña"
        tests:
          - unique
          - not_null

  - name: stg_clima
    description: "Capa de staging para registros meteorológicos e índice de congestión vial"
    columns:
      - name: fecha
        description: "Fecha del registro climático"
        tests:
          - unique
          - not_null

  - name: stg_viajes
    description: "Capa de staging para transacciones de viajes y cálculo de tarifa dinámica"
    columns:
      - name: id_viaje
        description: "Identificador único del viaje"
        tests:
          - unique
          - not_null
      - name: es_cancelado
        description: "Indicador booleano de cancelación"
        tests:
          - not_null
