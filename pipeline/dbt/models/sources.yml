version: 2

sources:
  - name: raw
    description: "Tablas transaccionales OLTP / raw staging de MoviGo (Managua) en PostgreSQL"
    database: "{{ env_var('RAW_DB_NAME', 'raw') }}"
    schema: "{{ env_var('RAW_SCHEMA', 'public') }}"
    tables:
      - name: zonas_urbanas
        description: "Cuadrantes y sectores urbanos de Managua con coordenadas y tarifas base de bajada de bandera"
        columns:
          - name: id_zona
            description: "Identificador único de la zona urbana"
            tests:
              - unique
              - not_null

      - name: usuarios
        description: "Directorio de usuarios pasajeros registrados en la plataforma MoviGo"
        columns:
          - name: id_usuario
            description: "Identificador único del pasajero"
            tests:
              - unique
              - not_null

      - name: conductores
        description: "Flota de socios conductores registrados, tipo de vehículo y métricas de desempeño"
        columns:
          - name: id_conductor
            description: "Identificador único del socio conductor"
            tests:
              - unique
              - not_null

      - name: campanas_incentivos
        description: "Campañas de bonos e incentivos económicos para oferta de conductores"
        columns:
          - name: id_campana
            description: "Identificador único de la campaña de incentivo"
            tests:
              - unique
              - not_null

      - name: clima_cuadrantes
        description: "Series temporales de meteorología (precipitación, temp) e índice de congestión vial"
        columns:
          - name: fecha
            description: "Fecha calendario del registro climático"
            tests:
              - unique
              - not_null

      - name: viajes
        description: "Transacciones de viajes solicitados y ejecutados con cálculo de tarifa dinámica"
        columns:
          - name: id_viaje
            description: "Identificador único del viaje"
            tests:
              - unique
              - not_null

      - name: telemetria_conductores
        description: "Pings de posicionamiento GPS vehicular y velocidad instantánea en ruta"
        columns:
          - name: id_telemetria
            description: "Identificador único del ping telemétrico"
            tests:
              - unique
              - not_null
