version: 2

models:
  - name: dim_zones
    description: "Conformed dimension of 24 urban zones, districts and socioeconomic strata of Managua"
    columns:
      - name: sk_zone
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: zone_id
        description: "Natural operational zone identifier"
        tests:
          - unique
          - not_null
      - name: district
        description: "Administrative district of Managua"

  - name: dim_quadrants
    description: "Conformed dimension of 298 sub-zone urban quadrants denormalized with zone data"
    columns:
      - name: sk_quadrant
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: quadrant_id
        description: "Natural operational quadrant identifier"
        tests:
          - unique
          - not_null
      - name: sk_zone
        description: "Foreign key to dim_zones"
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: sk_zone

  - name: dim_weather
    description: "Conformed daily time series dimension of microclimate, channel runoff, and congestion"
    columns:
      - name: sk_weather
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: date
        description: "Calendar date"
        tests:
          - unique
          - not_null
      - name: season
        description: "Climatic season in Managua: rainy vs dry"
        tests:
          - accepted_values:
              values: ['rainy', 'dry']

  - name: dim_users
    description: "Conformed dimension of passengers, tenure, and payment preferences"
    columns:
      - name: sk_user
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Natural operational user identifier"
        tests:
          - unique
          - not_null

  - name: dim_drivers
    description: "Conformed dimension of active driver fleet, vehicles, and maintenance history"
    columns:
      - name: sk_driver
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: driver_id
        description: "Natural operational driver identifier"
        tests:
          - unique
          - not_null

  - name: dim_campaigns
    description: "Dimension of incentive programs enriched with target zone and district"
    columns:
      - name: sk_campaign
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: campaign_id
        description: "Natural operational campaign identifier"
        tests:
          - unique
          - not_null
      - name: sk_target_zone
        description: "Foreign key to dim_zones"
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: sk_zone

  - name: fct_viajes
    description: "Atomic trip fact table for dynamic pricing and cancellation analysis"
    columns:
      - name: sk_viaje
        description: "Surrogate primary key (MD5)"
        tests:
          - unique
          - not_null
      - name: sk_zone_origin
        description: "Foreign key to dim_zones (origin)"
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: sk_zone
      - name: sk_zone_destination
        description: "Foreign key to dim_zones (destination)"
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: sk_zone
      - name: sk_user
        description: "Foreign key to dim_users"
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: sk_user
      - name: sk_weather
        description: "Foreign key to dim_weather"
        tests:
          - not_null
          - relationships:
              to: ref('dim_weather')
              field: sk_weather
      - name: is_cancelled
        description: "Boolean indicator of cancelled trip"
        tests:
          - not_null
